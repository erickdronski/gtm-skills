# Cut a release from a version tag.
#
#   git tag v0.1.0 && git push --tags
#
# The tag pins both the Python engine and the Claude Code plugin.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The source-distribution regression builds an archive with this backend.
      # A clean Python 3.12 installation otherwise skips that check.
      - run: python -m pip install "setuptools>=77"
      - run: python -m unittest discover -s tests -t .
      - run: python tools/validate_skills.py
      - name: Plugin manifests must parse
        run: |
          python -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
